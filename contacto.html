<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Pinki y Cerebro</title>
    <link rel="icon" href="images/logoEquipo.jpg" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Formulario de Contacto</h1>
        <p>Mándanos un mensaje</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="equipo.html">Nombre del Equipo</a>
        <a href="acerca.html">Acerca de</a>
    </nav>

    <main class="container">
        <!-- Centramos el formulario usando grid de Bootstrap -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <section class="seccion-blanca">
                    <h2 class="margen-abajo">Contáctanos</h2>
                    
                    <form action="#" method="POST">
                        <fieldset style="border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                            <legend style="font-size: 1.1rem; font-weight: bold; width: auto; padding: 0 10px; color: #003366;">Datos del Mensaje</legend>
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Tu Mensaje:</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="¿Qué nos quieres decir?" required></textarea>
                            </div>
                        </fieldset>

                        <button type="submit" class="btn btn-primary" style="background-color: #003366; border: none; width: 100%;">Enviar Mensaje</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer>
        <p>Equipo Pinki y Cerebro &bull; Programación Web XB &bull; 2026</p>
    </footer>

</body>
</html>
